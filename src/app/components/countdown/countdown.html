<div class="flex flex-col items-center">
  @if (!isFinished()) {
    <div class="flex items-center gap-3">
      <div class="flex flex-col items-center gap-1">
        <h1 class="text-2xl font-medium">{{ days() | number: '2.0' }}</h1>
        <p class="text-sm">Dias</p>
      </div>
      <span class="text-2xl">:</span>
      <div class="flex flex-col items-center gap-1">
        <h1 class="text-2xl font-medium">{{ hours() | number: '2.0' }}</h1>
        <p class="text-sm">Horas</p>
      </div>
      <span class="text-2xl">:</span>
      <div class="flex flex-col items-center gap-1">
        <h1 class="text-2xl font-medium">{{ minutes() | number: '2.0' }}</h1>
        <p class="text-sm">Minutos</p>
      </div>
      <span class="text-2xl">:</span>
      <div class="flex flex-col items-center gap-1">
        <h1 class="text-2xl font-medium">{{ seconds() | number: '2.0' }}</h1>
        <p class="text-sm">Segundos</p>
      </div>
    </div>
  } @else {
    <span>O tempo acabou!</span>
  }
</div>
