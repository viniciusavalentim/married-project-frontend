<div class="min-h-screen bg-[#f8f9fb] flex flex-col justify-center py-12 sm:px-6 lg:px-8 font-sans">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center mb-4">
      <div class="h-14 w-14 bg-[#0f172a] rounded-2xl flex items-center justify-center shadow-lg">
        <ng-icon name="lucideLock" color="white" class="text-2xl"></ng-icon>
      </div>
    </div>
    <h2 class="text-center text-2xl font-bold text-gray-900 tracking-tight">Acesso Restrito</h2>
    <p class="mt-2 text-center text-sm text-gray-500">
      Insira a senha de acesso para gerenciar os presentes
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md px-4 sm:px-0">
    <div
      class="bg-white py-8 px-4 shadow-[0_8px_30px_rgb(0,0,0,0.04)] sm:rounded-2xl sm:px-10 border border-gray-100"
    >
      <form class="space-y-6" (ngSubmit)="onSubmit()">
        <div>
          <label for="password" class="block text-sm font-semibold text-gray-700 mb-1.5">
            Senha
          </label>
          <div class="relative rounded-xl shadow-sm">
            <div
              class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400"
            >
              <ng-icon name="lucideLock" class="text-lg"></ng-icon>
            </div>

            <input
              [type]="showPassword() ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="password"
              required
              class="block w-full pl-11 pr-10 py-3 sm:text-sm border-gray-200 rounded-xl focus:ring-2 focus:ring-slate-900/10 focus:border-slate-900 bg-gray-50/50 text-gray-900 transition-all outline-none"
              placeholder="Digite a senha..."
            />

            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-700 focus:outline-none transition-colors"
            >
              <ng-icon
                [name]="showPassword() ? 'lucideEyeOff' : 'lucideEye'"
                class="text-lg"
              ></ng-icon>
            </button>
          </div>

          @if (errorMessage()) {
            <p class="mt-2.5 text-sm text-red-500 flex items-center gap-1.5 font-medium">
              <span class="bg-red-100 p-0.5 rounded-full flex items-center justify-center">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-3 w-3 text-red-600"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                >
                  <path
                    fill-rule="evenodd"
                    d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                    clip-rule="evenodd"
                  />
                </svg>
              </span>
              {{ errorMessage() }}
            </p>
          }

          @if (successMessage()) {
            <p class="mt-2.5 text-sm text-emerald-600 flex items-center gap-1.5 font-medium">
              <span class="bg-emerald-100 p-0.5 rounded-full flex items-center justify-center">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-3 w-3 text-emerald-600"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                >
                  <path
                    fill-rule="evenodd"
                    d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                    clip-rule="evenodd"
                  />
                </svg>
              </span>
              Acesso liberado! Redirecionando...
            </p>
          }
        </div>

        <div>
          <button
            type="submit"
            [disabled]="!password()"
            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-semibold text-white bg-[#0f172a] hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Entrar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
